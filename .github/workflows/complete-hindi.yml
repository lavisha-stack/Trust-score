name: Complete Hindi translation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-hindi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Complete worker-facing Hindi translation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* TRUSTSCORE-HINDI-COMPLETE */'
          if marker in s:
              print('Hindi completion patch already present; nothing to do.')
              raise SystemExit(0)

