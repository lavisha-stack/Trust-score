  };

  function hiText(text){
    if(!text) return text;
    let t=text.trim();
    if(COMPLETE_HI[t]!==undefined) return COMPLETE_HI[t];
    let out=text;
    Object.keys(COMPLETE_HI).sort((a,b)=>b.length-a.length).forEach(k=>{
      if(COMPLETE_HI[k]!==undefined) out=out.split(k).join(COMPLETE_HI[k]);
    });
    out=out.replace(/(months)/g,'महीने').replace(/(secondary)/g,'दूसरे स्रोत');
    return out;
  }

  function translateDOM(){
    const btn=document.getElementById('btn-lang');
    if(!btn || !btn.textContent.includes('हिंदी')) return;
    const root=document.body;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const p=n.parentElement;
      if(!p || p.tagName==='SCRIPT' || p.tagName==='STYLE') return;
      const v=n.nodeValue;
      const h=hiText(v);
      if(h!==v) n.nodeValue=h;
    });
    document.documentElement.lang='hi';
  }

  const observer=new MutationObserver(()=>{
    clearTimeout(window.__tsHiTimer);
    window.__tsHiTimer=setTimeout(translateDOM,10);
  });
  observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  window.addEventListener('load',translateDOM);
  document.addEventListener('click',e=>{
    if(e.target && e.target.id==='btn-lang') setTimeout(translateDOM,20);
  });
})();
'''
