name: Load demo controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-demo-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add demo override script to index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script = '<script src="demo-overrides.js"></script>'

          if script not in text:
              marker = '<script src="app.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find app.js script tag')
              text = text.replace(marker, marker + '\n' + script, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load clean demo controls"
          git push
